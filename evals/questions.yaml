# The common questions. Expectations assert DESIRED behaviour; when current
# retrieval can't meet one for a known reason, the case carries `xfail: <reason>`
# and stays visible on every report instead of gating.
#
# Case-writing rules (see the design spec):
# - never embed the literal gate code / padlock combos — assert the label.
# - contact details carried by camp documents are legitimate answer content;
#   must_not_mention is for invention markers only, never contact shapes.

# --- logistics: the camp_fact layer -----------------------------------------
- id: water-how
  q: how do we get water
  category: logistics
  retrieval: {must_hit: [refill]}
  answer: {must_mention: [refill]}
- id: water-delivered
  q: when is the water delivered
  category: logistics
  retrieval: {must_hit: [refill]}
- id: arrival
  q: when should we arrive at the playa
  category: logistics
  retrieval: {must_hit: [arrival]}
- id: trash-strike
  q: where do we dump trash during strike
  category: logistics
  retrieval: {must_hit: [fernley]}
  xfail: "recency-dilution: 'during'/'strike' aren't stop-filtered and match many higher-scoring 2023-2025 facts (none about the trash dump), so the 2019 Fernley fact ranks past the top-5 cutoff"
- id: warehouse
  q: where is the warehouse
  category: logistics
  retrieval: {must_hit: [monument]}
- id: decom-house
  q: where is the decom house
  category: logistics
  retrieval: {must_hit: [tahoe]}
  xfail: "entity-name-saturation: query terms 'decom'+'house' are both substrings of the entity name, so no distinguishing term remains and search falls back to the 4 most recent facts by date — excluding the 2022 fact with the Tahoe City address"
- id: power
  q: where does our power come from
  category: logistics
  retrieval: {must_hit: [power]}
- id: shade-up
  q: how do the shade structures go up
  category: logistics
  retrieval: {must_hit: [shade]}
- id: shifts
  q: how do camp shifts work
  category: logistics
  retrieval: {must_hit: [shift]}
- id: dinner
  q: who cooks dinner at camp
  category: logistics
  retrieval: {must_hit: [cooking]}

# --- documents: the manual must open ----------------------------------------
- id: generator-start
  q: how do I start the generator
  category: documents
  retrieval: {must_hit: [black knob]}
- id: gray-water
  q: what do we do with gray water
  category: documents
  retrieval: {must_hit: [water]}
- id: medkit
  q: do we have a medkit
  category: documents
  retrieval: {must_hit: [med kit]}
  xfail: "E7-vocab: 'medkit' cannot reach 'med kit' or 'first aid' by keyword"
- id: first-aid
  q: where is the first aid kit
  category: documents
  retrieval: {must_hit: [first aid box]}
- id: medkit-author
  q: who put together the med kit
  category: documents
  retrieval: {must_hit: [madeline]}
- id: hurt
  q: what happens if someone gets hurt at camp
  category: documents
  retrieval: {must_hit: [safety]}
  xfail: "recency-dilution: none of 'happens'/'someone'/'gets'/'hurt' appear in any camp fact, so ranking collapses to whichever recent fact contains the literal word 'camp' — the medical/ESD safety facts that actually answer this are older and rank past the top-5 cutoff"

# --- gear and places: the entity layer --------------------------------------
- id: doris-what
  q: what is Doris
  category: entities
  retrieval: {must_hit: [doris]}
  answer: {must_mention: [doris]}
- id: doris-ladders
  q: are there ladders in Doris
  category: entities
  retrieval: {must_hit: [ladder]}
  answer: {must_mention: ["2022"]}   # the contradiction: both records, dated
- id: lucy-what
  q: what is Lucy
  category: entities
  retrieval: {must_hit: [lucy]}
- id: lucy-access
  # The expectation used to assert "emigrant" with a gate-code mention —
  # a wrong guess: the 2025 manual says Lucy now lives at Black Rock
  # Rentals (fka Burn Pit Storage) in Empire; Emigrant Storage is an
  # earlier era's answer. Corrected 2026-08-19 against the run artifact.
  q: how do we get into Lucy at the storage place
  category: entities
  retrieval: {must_hit: [burn pit]}
  answer: {must_mention: [burn pit]}
- id: lucy-vocative
  # People address her by name — "lucy, how do we get water" is a water
  # question, not a Lucy question. Her name in the query must not drown the
  # actual subject. This is the case that justified stop-listing "lucy";
  # now it guards the un-stop-listing.
  q: lucy how do we get water
  category: entities
  retrieval: {must_hit: [refill]}
- id: empire-storage
  q: how do I get into Empire storage
  category: entities
  retrieval: {must_hit: [emigrant]}
  xfail: "E7-vocab: 'Empire' cannot reach 'Emigrant Storage' by keyword"
- id: boris-what
  q: what is Boris
  category: entities
  retrieval: {must_hit: [boris]}
- id: radish
  q: what is Radish
  category: entities
  retrieval: {must_hit: [radish]}

